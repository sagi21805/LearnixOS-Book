[book]
authors = ["Sagi"]
title = "The LearnixOS Book"
language = "en"
src = "src"

[preprocessor.mdbook-rust-analyzer-highlight]
whichlang = true
command = "cargo run --release --manifest-path mdbook-rust-analyzer-highlight/Cargo.toml"
project-root = "./LearnixOS"
inlay-hint-config = "inlay_config.json"

[preprocessor.gh-issue-preview]
after = ["mdbook-rust-analyzer-highlight"]
command = "cargo run --release --manifest-path mdbook-gh-issue-preview/Cargo.toml"

[preprocessor.github-repository-card]
after = ["gh-issue-preview"]
command = "cargo run --release --manifest-path mdbook-repository-card/Cargo.toml"
username = "sagi21805"
repository = "LearnixOS"
patreon_url = "https://patreon.com/LearnixOS?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink"

[output.html]
git-repository-url = "https://github.com/sagi21805/LearnixOS"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = [
    "theme/whichlang.css",
    "theme/hlrs.css",
    "theme/gh-issue.css",
    "theme/tags.css",
    "theme/github-box.css",
]
additional-js = [
    "theme/whichlang.js",
    "theme/filepath-links.js",
    "theme/giscuss.js",
    "theme/tags.js",
    "theme/highlight.js",
    "theme/github-card.js",
]
mathjax-support = true

[output.html.playground]
runnable = true
editable = true

[output.html.redirect]
"/ch02-03-implementing-the-bitfields-proc-macro.html" = "/ch02-05-implementing-the-bitfields-proc-macro.html"
"/ch03-00-printing-to-screen.html" = "/ch04-00-printing-to-screen.html"
